name: Sync Live Desk context

on:
  schedule:
    # Runs after the Live Desk's Kuala Lumpur research slots.
    - cron: '10 1,4,16,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: power-stack-live-context
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sanitized Live Desk context
        run: |
          curl --fail --retry 3 --retry-delay 5 --silent --show-error \
            https://alchemy-live-market-desk.vercel.app/api/power-stack-context \
            -o data/live-context.tmp.json
          jq . data/live-context.tmp.json > data/live-context.json
          rm data/live-context.tmp.json
      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- data/live-context.json; then
            echo "No Live Desk context change"
            exit 0
          fi
          git config user.name "power-stack-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-context.json
          git commit -m "Sync Live Desk context"
          git push
