name: Sync Live Desk canonical context

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: power-stack-live-desk-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Power Stack
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull canonical Live Desk context
        env:
          LIVE_DESK_DOSSIER_V2_URL: https://alchemy-live-market-desk.vercel.app/api/dossier-v2
        run: node scripts/sync-live-desk.mjs

      - name: Commit changed snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/live-desk-canonical.json; then
            echo "Live Desk snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-desk-canonical.json
          git commit -m "chore: sync Live Desk canonical context [skip ci]"
          git push origin HEAD:main
