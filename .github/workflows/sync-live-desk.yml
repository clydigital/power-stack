name: Sync Live Desk canonical context

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: power-stack-live-desk-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Power Stack
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull canonical Live Desk context
        env:
          LIVE_DESK_MARKET_INTELLIGENCE_URL: https://alchemy-live-market-desk.vercel.app/api/market-intelligence-snapshot
        run: node scripts/sync-live-desk.mjs

      - name: Rebuild portfolio exposure overlay
        run: node scripts/generate-portfolio-live-overlay.mjs

      - name: Commit changed snapshots
        shell: bash
        run: |
          if git diff --quiet -- data/live-desk-canonical.json data/portfolio-live-overlay.json; then
            echo "Live Desk and portfolio overlay unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-desk-canonical.json data/portfolio-live-overlay.json
          git commit -m "chore: sync Live Desk + portfolio overlay [skip ci]"
          git push origin HEAD:main
