name: Validate Live fundamentals boundary

on:
  pull_request:
    paths:
      - "app.js"
      - "index.html"
      - "motion.html"
      - "holdings.html"
      - "watchlist.html"
      - "themes.html"
      - "capital-scarcity.html"
      - "capital-scarcity.js"
      - "data/live-fundamentals-snapshot.json"
      - "data/live-fundamentals-export-config.json"
      - "data/market-extension*.json"
      - "data/live-desk-canonical.json"
      - "data/market-motion.json"
      - "data/motion-shadow.json"
      - "data/research-sweep-config.json"
      - "data/research-sweep-latest.json"
      - "data/power-sweep-latest.json"
      - "data/macro-methodology.json"
      - "scripts/generate-live-fundamentals-snapshot.mjs"
      - "scripts/sync-live-desk.mjs"
      - "scripts/generate-motion-shadow.mjs"
      - "scripts/generate-portfolio-live-overlay.mjs"
      - "scripts/generate-power-sweep.mjs"
      - "scripts/validate-live-motion-boundary.mjs"
      - "scripts/validate-fundamentals-only-exchange.mjs"
      - "scripts/sync-holding-tape.mjs"
      - "scripts/validate-static-html-js.mjs"
      - "data/portfolio-live-overlay.json"
      - "data/holding-tape.json"
      - "data/portfolio-management.json"
      - "data/macro-sensitivities.json"
      - "data/macro-sensitivity-supplement.json"
      - "data/holdings-fundamentals.json"
      - ".github/workflows/sync-live-desk.yml"
      - ".github/workflows/sync-holding-tape.yml"
      - ".github/workflows/validate-live-rating-snapshot.yml"
  push:
    branches: [main]
    paths:
      - "motion.html"
      - "index.html"
      - "data/live-desk-canonical.json"
      - "data/market-motion.json"
      - "data/motion-shadow.json"
      - "data/live-fundamentals-snapshot.json"
      - "data/live-fundamentals-export-config.json"
      - "data/market-extension*.json"
      - "data/research-sweep-config.json"
      - "scripts/generate-live-fundamentals-snapshot.mjs"
      - "scripts/sync-live-desk.mjs"
      - "scripts/generate-motion-shadow.mjs"
      - "scripts/generate-portfolio-live-overlay.mjs"
      - "scripts/generate-power-sweep.mjs"
      - "scripts/validate-live-motion-boundary.mjs"
      - "scripts/validate-fundamentals-only-exchange.mjs"
      - ".github/workflows/validate-live-rating-snapshot.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check capital-scarcity.js
      - run: node --check scripts/sync-live-desk.mjs
      - run: node --check scripts/generate-motion-shadow.mjs
      - run: node --check scripts/generate-live-fundamentals-snapshot.mjs
      - run: node --check scripts/generate-portfolio-live-overlay.mjs
      - run: node --check scripts/generate-power-sweep.mjs
      - run: node --check scripts/validate-live-motion-boundary.mjs
      - run: node --check scripts/validate-fundamentals-only-exchange.mjs
      - run: node --check scripts/sync-holding-tape.mjs
      - run: node scripts/sync-holding-tape.mjs --check
      - run: node scripts/validate-static-html-js.mjs
      - run: node scripts/validate-live-motion-boundary.mjs
      - run: node scripts/validate-fundamentals-only-exchange.mjs
      - run: node scripts/generate-motion-shadow.mjs --check
      - run: node -e "const fs=require('fs'); for (const f of ['data/live-desk-canonical.json','data/motion-shadow.json','data/live-fundamentals-snapshot.json','data/portfolio-live-overlay.json','data/holding-tape.json','data/research-sweep-config.json','data/research-sweep-latest.json','data/power-sweep-latest.json','data/macro-methodology.json']) JSON.parse(fs.readFileSync(f,'utf8'));"
      - run: node scripts/generate-live-fundamentals-snapshot.mjs --check
      - run: node scripts/generate-portfolio-live-overlay.mjs --check
      - run: node scripts/generate-power-sweep.mjs --check
