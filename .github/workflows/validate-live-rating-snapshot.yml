name: Validate Live fundamentals boundary

on:
  pull_request:
    paths:
      - "app.js"
      - "index.html"
      - "holdings.html"
      - "watchlist.html"
      - "themes.html"
      - "data/live-fundamentals-snapshot.json"
      - "data/live-fundamentals-export-config.json"
      - "data/market-extension*.json"
      - "data/live-desk-canonical.json"
      - "data/research-sweep-config.json"
      - "data/macro-methodology.json"
      - "scripts/generate-live-fundamentals-snapshot.mjs"
      - "scripts/sync-live-desk.mjs"
      - "scripts/generate-portfolio-live-overlay.mjs"
      - "scripts/sync-holding-tape.mjs"
      - "scripts/validate-static-html-js.mjs"
      - "data/portfolio-live-overlay.json"
      - "data/holding-tape.json"
      - "data/portfolio-management.json"
      - "data/macro-sensitivities.json"
      - "data/macro-sensitivity-supplement.json"
      - "data/holdings-fundamentals.json"
      - ".github/workflows/sync-live-desk.yml"
      - ".github/workflows/validate-live-rating-snapshot.yml"
  push:
    branches: [main]
    paths:
      - "data/live-fundamentals-snapshot.json"
      - "data/live-fundamentals-export-config.json"
      - "data/market-extension*.json"
      - "data/research-sweep-config.json"
      - "scripts/generate-live-fundamentals-snapshot.mjs"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check scripts/sync-live-desk.mjs
      - run: node --check scripts/generate-live-fundamentals-snapshot.mjs
      - run: node --check scripts/generate-portfolio-live-overlay.mjs
      - run: node --check scripts/sync-holding-tape.mjs
      - run: node scripts/sync-holding-tape.mjs --check
      - run: node scripts/validate-static-html-js.mjs
      - run: node -e "const fs=require('fs'); for (const f of ['data/live-desk-canonical.json','data/live-fundamentals-snapshot.json','data/portfolio-live-overlay.json','data/holding-tape.json','data/research-sweep-config.json','data/macro-methodology.json']) JSON.parse(fs.readFileSync(f,'utf8'));"
      - run: node scripts/generate-live-fundamentals-snapshot.mjs --check
      - run: node scripts/generate-portfolio-live-overlay.mjs --check
