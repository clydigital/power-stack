name: Validate Full Library UI
on:
  push:
    branches: [main]
    paths:
      - 'research-library.html'
      - 'app.js'
      - 'styles.css'
      - 'scripts/check-library-ui.mjs'
      - 'baskets.html'
      - 'baskets.js'
      - 'baskets.css'
      - 'data/basket-strategies.json'
      - 'ps-ux.js'
      - 'ps-ux.css'
      - 'holdings.html'
      - 'scripts/check-basket-ui.mjs'
      - 'scripts/validate-static-html-js.mjs'
      - '.github/workflows/validate-library-ui.yml'
  pull_request:
    paths:
      - 'research-library.html'
      - 'app.js'
      - 'styles.css'
      - 'scripts/check-library-ui.mjs'
      - 'baskets.html'
      - 'baskets.js'
      - 'baskets.css'
      - 'data/basket-strategies.json'
      - 'ps-ux.js'
      - 'ps-ux.css'
      - 'holdings.html'
      - 'scripts/check-basket-ui.mjs'
      - 'scripts/validate-static-html-js.mjs'
      - '.github/workflows/validate-library-ui.yml'
jobs:
  library-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate external JavaScript syntax
        run: node --check app.js
      - name: Validate Full Library inline scripts
        run: node scripts/validate-static-html-js.mjs research-library.html
      - name: Validate Full Library missing-data and layout guards
        run: node scripts/check-library-ui.mjs
      - name: Validate basket model, investment taxonomy and Holdings integrity
        run: |
          node --check baskets.js
          node --check ps-ux.js
          node scripts/validate-static-html-js.mjs holdings.html
          node scripts/validate-static-html-js.mjs baskets.html
          node scripts/check-basket-ui.mjs
