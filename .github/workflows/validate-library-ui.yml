name: Validate Full Library UI
on:
  push:
    branches: [main]
    paths:
      - 'research-library.html'
      - 'app.js'
      - 'styles.css'
      - 'scripts/check-library-ui.mjs'
      - 'baskets.html'
      - 'baskets.js'
      - 'baskets.css'
      - 'data/basket-strategies.json'
      - 'ps-ux.js'
      - 'security-news.html'
      - 'data/security-news-research-2026-10-30.json'
      - 'research/2026-10-30-all-54-securities-news-deep-dive.md'
      - 'scripts/check-security-news-audit.mjs'
      - 'market-to-portfolio.html'
      - 'data/market-summary.json'
      - 'data/bluebelly-portfolio-bridge-2026-10-30.json'
      - 'scripts/check-bluebelly-portfolio-bridge.mjs'
      - 'ps-ux.css'
      - 'holdings.html'
      - 'scripts/check-basket-ui.mjs'
      - 'ps-market-icons.js'
      - 'ps-market-icons.css'
      - 'assets/market-iconography/sprite.svg'
      - 'scripts/check-market-iconography.mjs'
      - 'index.html'
      - 'themes.html'
      - 'watchlist.html'
      - 'motion.html'
      - 'capital-scarcity.html'
      - 'scripts/validate-static-html-js.mjs'
      - '.github/workflows/validate-library-ui.yml'
  pull_request:
    paths:
      - 'research-library.html'
      - 'app.js'
      - 'styles.css'
      - 'scripts/check-library-ui.mjs'
      - 'baskets.html'
      - 'baskets.js'
      - 'baskets.css'
      - 'data/basket-strategies.json'
      - 'ps-ux.js'
      - 'security-news.html'
      - 'data/security-news-research-2026-10-30.json'
      - 'research/2026-10-30-all-54-securities-news-deep-dive.md'
      - 'scripts/check-security-news-audit.mjs'
      - 'market-to-portfolio.html'
      - 'data/market-summary.json'
      - 'data/bluebelly-portfolio-bridge-2026-10-30.json'
      - 'scripts/check-bluebelly-portfolio-bridge.mjs'
      - 'ps-ux.css'
      - 'holdings.html'
      - 'scripts/check-basket-ui.mjs'
      - 'ps-market-icons.js'
      - 'ps-market-icons.css'
      - 'assets/market-iconography/sprite.svg'
      - 'scripts/check-market-iconography.mjs'
      - 'index.html'
      - 'themes.html'
      - 'watchlist.html'
      - 'motion.html'
      - 'capital-scarcity.html'
      - 'scripts/validate-static-html-js.mjs'
      - '.github/workflows/validate-library-ui.yml'
jobs:
  library-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate external JavaScript syntax
        run: node --check app.js
      - name: Validate Full Library inline scripts
        run: node scripts/validate-static-html-js.mjs research-library.html
      - name: Validate Full Library missing-data and layout guards
        run: node scripts/check-library-ui.mjs
      - name: Validate basket model, investment taxonomy and Holdings integrity
        run: |
          node --check baskets.js
          node --check ps-ux.js
          node scripts/validate-static-html-js.mjs holdings.html
          node scripts/validate-static-html-js.mjs baskets.html
          node scripts/check-basket-ui.mjs
      - name: Validate first-party Hybrid market pictograms and page wiring
        run: |
          node --check ps-market-icons.js
          node scripts/check-market-iconography.mjs
      - name: Validate Bluebelly-to-Power-Stack source-dated decision bridge
        run: |
          node --check ps-ux.js
          node scripts/validate-static-html-js.mjs market-to-portfolio.html
          node scripts/check-bluebelly-portfolio-bridge.mjs
      - name: Validate 54-security detailed news review
        run: |
          node --check ps-ux.js
          node scripts/validate-static-html-js.mjs security-news.html
          node scripts/check-security-news-audit.mjs
