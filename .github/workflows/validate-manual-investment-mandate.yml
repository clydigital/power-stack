name: Validate manual investment mandate
on:
  push:
    branches: [main]
    paths:
      - 'PS_MANUAL_INVESTMENT_MANIFESTO.md'
      - 'data/rakuten-one-year-mandate.json'
      - 'data/research-sweep-config.json'
      - 'data/portfolio-management.json'
      - 'index.html'
      - 'scripts/check-manual-investment-mandate.mjs'
      - '.github/workflows/validate-manual-investment-mandate.yml'
  pull_request:
    paths:
      - 'PS_MANUAL_INVESTMENT_MANIFESTO.md'
      - 'data/rakuten-one-year-mandate.json'
      - 'data/research-sweep-config.json'
      - 'data/portfolio-management.json'
      - 'index.html'
      - 'scripts/check-manual-investment-mandate.mjs'
      - '.github/workflows/validate-manual-investment-mandate.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm RM13491 risk mandate and authority boundaries
        run: node scripts/check-manual-investment-mandate.mjs
      - name: Check static homepage syntax
        run: node scripts/validate-static-html-js.mjs index.html
